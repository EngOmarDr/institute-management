<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Page Shadow / Depth Gradient -->
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Elements -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>

    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base / Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Main Content Group with Shadow -->
  <g filter="url(#softShadow)">

    <!-- OPEN BOOK (FOUNDATION OF KNOWLEDGE) -->
    <!-- Spine Center Base -->
    <path d="M256 395 L256 425" stroke="#047857" stroke-width="6" stroke-linecap="round" />

    <!-- Left Book Page -->
    <path d="M256 415 C200 395 130 405 92 418 C88 419 84 416 84 412 L84 275 C84 271 88 268 92 267 C132 254 205 244 256 268 Z" 
          fill="url(#pageGradLeft)" />

    <!-- Right Book Page -->
    <path d="M256 415 C312 395 382 405 420 418 C424 419 428 416 428 412 L428 275 C428 271 424 268 420 267 C380 254 307 244 256 268 Z" 
          fill="url(#pageGradRight)" />

    <!-- Page Spine Divider Line -->
    <line x1="256" y1="268" x2="256" y2="415" stroke="#cbd5e1" stroke-width="3" />

    <!-- Left Page Accent Lines (Representing Text/Curriculum) -->
    <line x1="120" y1="300" x2="228" y2="295" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <line x1="120" y1="330" x2="228" y2="325" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <line x1="120" y1="360" x2="195" y2="355" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

    <!-- Right Page Accent Lines -->
    <line x1="284" y1="295" x2="392" y2="300" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <line x1="284" y1="325" x2="392" y2="330" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <line x1="284" y1="355" x2="357" y2="360" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

    <!-- Book Bottom Base Trim (Golden Edge) -->
    <path d="M86 418 C132 404 205 396 256 418 C307 396 380 404 426 418 L428 428 C382 414 307 406 256 428 C205 406 132 414 84 428 Z" 
          fill="url(#goldGrad)" opacity="0.9" />

    <!-- GRADUATION CAP (ACADEMIC EXCELLENCE) -->
    <g filter="url(#capShadow)">
      <!-- Cap Skull Cap Base -->
      <path d="M192 186 C192 186 200 226 256 226 C312 226 320 186 320 186 Z" fill="#0f172a" />

      <!-- Cap Diamond Mortarboard Top -->
      <polygon points="256,92 410,154 256,216 102,154" fill="#ffffff" />
      <polygon points="256,104 394,154 256,204 118,154" fill="#f8fafc" />

      <!-- Mortarboard Center Button -->
      <circle cx="256" cy="154" r="9" fill="url(#goldGrad)" />

      <!-- Mortarboard Tassel Ribbon & Fringes -->
      <path d="M256 154 C290 156 342 172 356 208 C358 214 358 238 358 248" 
            fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
      
      <!-- Tassel Brush/Fringe End -->
      <path d="M352 248 L364 248 L368 280 L348 280 Z" fill="url(#goldGrad)" />
      <circle cx="358" cy="248" r="5" fill="#f59e0b" />
    </g>

    <!-- Star of Excellence / Beacon atop cap -->
    <polygon points="256,58 261,72 276,73 264,83 268,98 256,88 244,98 248,83 236,73 251,72" fill="url(#goldGrad)" />
  </g>
</svg>